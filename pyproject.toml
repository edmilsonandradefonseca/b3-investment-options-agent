[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-investment-options-agent"
version = "0.1.0"
description = "Local-first investment and options decision copilot for the Brazilian B3 market."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Private" }
authors = [
    { name = "Edmilson Fonseca" }
]
dependencies = [
    "openpyxl>=3.1,<4",
    "pyarrow>=22,<26",
    "mcp>=1.28,<2",
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
    "langgraph>=0.6,<2",
    "openai>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.19,<2",
    "neo4j>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
