name: B3 Market provider diagnosis and repair
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-market-provider-repair.yml, scripts/diagnose_market_providers.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-market-provider-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test corrected curve adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: /opt/b3-investment-options-agent/.venv/bin/python -m pytest -q tests/test_b3_yield_curve.py
      - name: Install verified provider correction
        run: |
          set -euo pipefail
          provider=src/b3_agent/providers/b3_yield_curve.py
          if cmp -s "$provider" "/opt/b3-investment-options-agent/$provider"; then
            echo PROVIDER_ALREADY_INSTALLED=PASS
          else
            test -z "$(git -C /opt/b3-investment-options-agent status --porcelain --untracked-files=no)"
            install -m 0644 "$provider" "/opt/b3-investment-options-agent/$provider"
          fi
      - name: Bind runtime package to canonical production checkout
        run: |
          /opt/b3-investment-options-agent/.venv/bin/python -m pip install --no-deps -e /opt/b3-investment-options-agent
          /opt/b3-investment-options-agent/.venv/bin/python -c "from pathlib import Path; import b3_agent.providers.b3_yield_curve as provider; print('RUNTIME_PROVIDER_PATH=' + provider.__file__); assert Path(provider.__file__).resolve() == Path('/opt/b3-investment-options-agent/src/b3_agent/providers/b3_yield_curve.py')"
      - name: Restart runtime to load correction
        id: restart
        continue-on-error: true
        run: |
          sudo -n systemctl restart b3-runtime.service
          for attempt in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Diagnose providers without exposing credentials
        run: /opt/b3-investment-options-agent/.venv/bin/python scripts/diagnose_market_providers.py --require-curve
