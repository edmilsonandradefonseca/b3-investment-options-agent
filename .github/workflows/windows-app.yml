name: Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/react-functional-v43-integration
    paths:
      - "frontend/**"
      - ".github/workflows/windows-app.yml"

jobs:
  windows-nsis:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows 11 installer
        run: npm run windows:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: b3-investment-copilot-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
