name: B3 Ubuntu runner connectivity
on:
  pull_request:
    branches: ['**']
    paths: ['.github/workflows/b3-runner-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate stock-only collection and update idle production checkout
        shell: bash
        run: |
          /opt/b3-investment-options-agent/.venv/bin/python -m pytest tests/test_collection_universe.py tests/test_instrument_identity.py -q
          if systemctl is-active --quiet b3-opportunities-daily.service; then
            echo 'Production update skipped: review is still active'
            exit 1
          fi
          git -C /opt/b3-investment-options-agent diff --quiet
          git -C /opt/b3-investment-options-agent diff --cached --quiet
          test "$(git -C /opt/b3-investment-options-agent branch --show-current)" = feature/react-functional-v43-integration
          git -C /opt/b3-investment-options-agent fetch origin feature/react-functional-v43-integration
          git -C /opt/b3-investment-options-agent merge --ff-only "$GITHUB_SHA_CANDIDATE"
        env:
          GITHUB_SHA_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read-only Ubuntu connectivity and service status
        shell: bash
        run: |
          hostname
          date --iso-8601=seconds
          git -C /opt/b3-investment-options-agent rev-parse HEAD
          systemctl show b3-runtime.service b3-opportunities-daily.service b3-opportunities-daily.timer --property=Id,ActiveState,SubState,Result,ExecMainStatus
          systemctl --user show openclaw-gateway.service --property=Id,ActiveState,SubState,Result
          python3 - <<'PY'
          import socket
          for port in (8000, 18789):
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=3):
                      print(f"port {port}: reachable")
              except OSError as exc:
                  print(f"port {port}: {type(exc).__name__}")
          PY
