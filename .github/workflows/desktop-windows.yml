name: Desktop Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mcp-mvp

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend package and PyInstaller
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --onefile --name orchestrator --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols.http.auto src/b3_agent/server.py
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item dist/orchestrator.exe frontend/src-tauri/binaries/orchestrator.exe

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Tauri application icons
        run: npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Build Tauri Windows bundle
        run: npm run tauri -- build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: b3-investment-copilot-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
