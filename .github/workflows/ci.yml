name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - fix/react-portfolio-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest


  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React frontend
        working-directory: frontend
        run: npm run build


  v42-live-replay-preflight:
    if: github.head_ref == 'feature/v4.2-official-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Prefetch real CVM replay datasets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -o /tmp/cad_cia_aberta.csv \
            https://dados.cvm.gov.br/dados/CIA_ABERTA/CAD/DADOS/cad_cia_aberta.csv
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -o /tmp/fca_cia_aberta_2026.zip \
            https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FCA/DADOS/fca_cia_aberta_2026.zip
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -o /tmp/ipe_cia_aberta_2026.zip \
            https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ipe_cia_aberta_2026.zip

      - name: Select real replay evidence and inspect bounded prompt
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          from b3_agent.intelligence.issuer_registry import IssuerRegistry
          from b3_agent.intelligence.official_evidence import (
              OfficialEvidenceBuilder,
              evidence_for_reasoning,
              evidence_to_dict,
          )
          from b3_agent.providers.cvm_open_data import CvmOpenDataProvider

          path = Path("scripts/replay_v42_official_fact.py")
          spec = importlib.util.spec_from_file_location("v42_replay", path)
          replay = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(replay)

          provider = CvmOpenDataProvider(
              cad_url=Path("/tmp/cad_cia_aberta.csv").as_uri(),
              fca_url_template="file:///tmp/fca_cia_aberta_{year}.zip",
              ipe_url_template="file:///tmp/ipe_cia_aberta_{year}.zip",
          )
          registry = IssuerRegistry("/tmp/v42-replay-registry.sqlite3")
          registry.sync_from_cvm(provider=provider, year=2026)
          issuer = registry.resolve_issuer_by_ticker("PETR4")
          assert issuer and issuer.cvm_code

          result = provider.fetch_ipe_year(
              2026,
              cvm_codes=(issuer.cvm_code,),
              cnpjs=(issuer.cnpj,) if issuer.cnpj else (),
              categories=("Fato Relevante",),
          )
          builder = OfficialEvidenceBuilder(registry=registry)
          evidences = tuple(builder.from_open_data_ipe(row) for row in result.records)
          evidence = replay.select_material_evidence(evidences)
          prompt = replay.replay_prompt("PETR4", evidence)
          compact = json.dumps(evidence_for_reasoning(evidence), ensure_ascii=False)
          full = json.dumps(evidence_to_dict(evidence), ensure_ascii=False, default=str)

          output = {
              "title": evidence.title,
              "published_at": (
                  evidence.metadata.published_at.isoformat()
                  if evidence.metadata.published_at else None
              ),
              "materiality_reason": evidence.metadata.materiality_reason,
              "pit_status": evidence.metadata.pit_status,
              "prompt_chars": len(prompt),
              "compact_evidence_chars": len(compact),
              "full_evidence_chars": len(full),
              "cvm_records_considered": len(evidences),
          }
          print(json.dumps(output, ensure_ascii=False, indent=2))
          assert evidence.metadata.materiality_reason == "OFFICIAL_FATO_RELEVANTE"
          assert evidence.metadata.pit_status == "HISTORICAL_RECONSTRUCTION"
          assert len(prompt) < 6000
          assert len(compact) < len(full)
          PY
