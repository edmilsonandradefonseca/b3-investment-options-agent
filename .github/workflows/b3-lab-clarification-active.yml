name: B3 active Lab clarification (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-lab-clarification-active.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-clarification:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify restarted implementation and active clarification
        run: |
          /opt/b3-investment-options-agent/.venv/bin/python - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import httpx
          pid=subprocess.check_output(['systemctl','show','b3-runtime.service','--property=MainPID','--value'],text=True,timeout=10).strip()
          assert int(pid)>0
          boot=next(int(line.split()[1]) for line in Path('/proc/stat').read_text().splitlines() if line.startswith('btime '))
          fields=Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
          started=boot+int(fields[19])/os.sysconf('SC_CLK_TCK')
          for name in ['src/b3_agent/server.py','src/b3_agent/routing/lab_clarification.py']:
              path=Path('/opt/b3-investment-options-agent')/name
              assert hashlib.sha256(path.read_bytes()).digest()==hashlib.sha256(Path(name).read_bytes()).digest()
              assert started>=path.stat().st_mtime
          response=httpx.post('http://127.0.0.1:8000/orchestrate',json={'task':'Vale manter, encerrar ou rolar uma opção da minha carteira?','context':{'workspace':'Strategy Lab'}},timeout=15)
          assert response.status_code==200
          payload=response.json()
          assert payload['status']=='NEEDS_CLARIFICATION'
          assert payload['result']['lab_clarification']['missing_fields']==['option_id']
          assert payload['result']['derived_synthesis_status']=='NOT_REQUESTED'
          assert payload['result']['telemetry']=={'llm_calls':0,'option_chain_calls':0}
          print('ACTIVE_LAB_CLARIFICATION_AND_RESTART=PASS',flush=True)
          PYCODE
