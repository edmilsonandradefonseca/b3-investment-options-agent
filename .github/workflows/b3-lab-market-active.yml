name: B3 Lab and Market active HTTP (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-lab-market-active.yml, scripts/validate_lab_market_active.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-lab-market-active
  cancel-in-progress: false
jobs:
  active-http:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify restarted process and installed implementation
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          pid=subprocess.check_output(['systemctl','show','b3-runtime.service','--property=MainPID','--value'],text=True,timeout=10).strip()
          assert int(pid)>0
          boot=next(int(line.split()[1]) for line in Path('/proc/stat').read_text().splitlines() if line.startswith('btime '))
          fields=Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
          started=boot+int(fields[19])/os.sysconf('SC_CLK_TCK')
          installed=Path('/opt/b3-investment-options-agent')
          files=['src/b3_agent/strategy_live.py','src/b3_agent/stock_purchase.py','src/b3_agent/economic_evidence.py','src/b3_agent/quant_engine.py','src/b3_agent/intelligence/workspace_context.py','src/b3_agent/server.py']
          for name in files:
              path=installed/name
              assert hashlib.sha256(path.read_bytes()).digest()==hashlib.sha256(Path(name).read_bytes()).digest(), f'Installed code mismatch: {name}'
              assert started>=path.stat().st_mtime, f'Process predates installation: {name}'
          print('ACTIVE_REVISION_AND_RESTART=PASS',flush=True)
          PYCODE
          systemctl show b3-runtime.service --property=MainPID --property=ActiveEnterTimestamp
      - name: Accept natural Lab comparison and senior Market Intelligence on active HTTP
        run: /opt/b3-investment-options-agent/.venv/bin/python scripts/validate_lab_market_active.py
