name: Dashboard Test Engine

on:
  workflow_call:

jobs:
  backend:
    name: Backend contracts + deep tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Run Python test suite
        run: pytest -q

  frontend-build:
    name: React build and boundary gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build React
        working-directory: frontend
        run: npm run build

  dashboard-e2e:
    name: React + Orchestrator + BTG + Copilot E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend-build]
    env:
      B3_AGENT_DATA_DIR: ${{ github.workspace }}/.ci-data
      B3_AGENT_LLM_ENABLED: "false"
      VITE_API_BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Prepare deterministic BTG fixtures
        run: python tests/e2e/prepare_dashboard_data.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start orchestrator
        run: |
          python -m uvicorn b3_agent.server:app --host 127.0.0.1 --port 8000 > /tmp/b3-orchestrator.log 2>&1 &
          echo $! > /tmp/b3-orchestrator.pid
      - name: Wait for orchestrator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b3-orchestrator.log
          exit 1
      - name: Run dashboard E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/b3-orchestrator.log

  gate:
    name: Dashboard APPROVED
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend-build, dashboard-e2e]
    steps:
      - name: Fail closed unless every gate passed
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend-build=${{ needs.frontend-build.result }}"
          echo "dashboard-e2e=${{ needs.dashboard-e2e.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend-build.result }}" = "success"
          test "${{ needs.dashboard-e2e.result }}" = "success"
          echo "DASHBOARD_GATE=APPROVED"
