name: B3 active Lab position selection (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-lab-position-active.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-lab-position-active
  cancel-in-progress: false
jobs:
  active-position:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify restarted process and current snapshot selection
        env:
          PYTHONPATH: /opt/b3-investment-options-agent/src
        run: /opt/b3-investment-options-agent/.venv/bin/python scripts/validate_lab_position_active.py
