name: B3 active runtime post-restart (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-post-restart-http.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-post-restart-http
  cancel-in-progress: false
jobs:
  active-http:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify the active HTTP process and structured comparison
        run: |
          python3 - <<'PY'
          import json, sys, time, subprocess
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from validate_live_workspace_outputs import call_json, make_cases, write_private_report
          base = "http://127.0.0.1:8000"
          health = call_json(base + "/health", None, 15)
          assert health["http_status"] == 200 and not health["transport_error_type"], "Runtime health failed"
          chart = call_json(base + "/analysis/live/PETR4", None, 20)
          assert chart["http_status"] == 200
          data = chart["response"]
          assert data["market"]["history_count"] >= 85
          assert str(data["market"]["latest"]["observation_timestamp"]).startswith("2026-10-02")
          assert {"b3_cotahist", "oplab"} <= set(data["source_refs"])
          assert data["options"]["contract_count"] == 0
          print("ACTIVE_PETR4_HTTP=PASS bars=" + str(data["market"]["history_count"]) + " options=0", flush=True)
          version = call_json(base + "/version", None, 15)
          assert version["http_status"] == 200
          assert version["response"].get("opportunity_screen_policy") == "B3_OBSERVED_STOCK_SCREEN_V1", "Active process did not load the observed screen"
          portfolio = call_json(base + "/portfolio/current", None, 30)["response"]
          position = next(row for row in portfolio["positions"] if row["instrument_type"] == "STOCK" and row["quantity"] >= 1)
          sell = position["ticker"]
          buy = "BBAS3" if sell != "BBAS3" else "ITUB4"
          request = {"task":"Compare one-share financed switch with explicit hypothetical zero costs.", "context":{"workspace":"Strategy Lab","comparison_assets":[sell,buy],"funded_switch":{"quantity":1,"fees_brl":0,"taxes_brl":0},"analysis_mode":"deterministic"}}
          response = call_json(base + "/orchestrate", request, 90)
          write_private_report(Path.home()/".local/share/b3-investment-options-agent/live-validation/active-funded-switch", {"instance":"ACTIVE HTTP systemd","response":response})
          body = response.get("response") or {}
          assert response["http_status"] == 200 and not body.get("error")
          result = body["result"]; funded = result["funded_switch"]
          assert result["telemetry"]["llm_calls"] == 0
          assert abs(funded["purchase_notional_brl"]+funded["residual_cash_brl"]-funded["net_sale_proceeds_brl"]) < 1e-7
          assert len(result["strategy_comparison"]["alternatives"]) == 2
          print(json.dumps({"case":"ACTIVE_FUNDED_SWITCH","http":200,"elapsed_ms":response["elapsed_ms"],"cash_conservation":"PASS","llm_calls":0}),flush=True)
          print("ACTIVE_FUNDED_SWITCH=PASS RUNTIME_MUTATIONS=NONE",flush=True)
          PY
      - name: Inspect only model-input availability from the latest private PUT report
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          folder=Path.home()/".local/share/b3-investment-options-agent/live-validation/put-pair/LOWEST_MODEL_EXPIRY_ITM"
          files=sorted(folder.glob("b3-live-workspaces-*.json"))
          assert files, "Expected private candidate report not found"
          data=json.loads(files[-1].read_text())["response"]["result"]
          for row in data["put_pair_comparison"]["rows"]:
              pack=data["asset_evidence"][row["underlying_ticker"]]
              quote=data["option_evidence"][row["option_id"]]["current_quote"]
              iv=quote.get("implied_volatility")
              print(json.dumps({"scope":"candidate private report, no active PUT acceptance","reason":row["probability_estimates"].get("reason"),"underlying_quote_present":bool(pack["market"].get("current_quote")),"iv_present":iv is not None,"iv_admissible":isinstance(iv,(int,float)) and math.isfinite(iv) and 0<iv<=3}),flush=True)
          print("BUSINESS_VALUES_PRINTED=NONE",flush=True)
          PY
