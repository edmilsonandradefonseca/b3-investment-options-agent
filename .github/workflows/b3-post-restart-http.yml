name: B3 active runtime post-restart (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-post-restart-http.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-post-restart-http
  cancel-in-progress: false
jobs:
  active-http:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify the active HTTP process and structured comparison
        run: |
          python3 - <<'PY'
          import json, sys, time, subprocess
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from validate_live_workspace_outputs import call_json, make_cases, write_private_report
          base = "http://127.0.0.1:8000"
          health = call_json(base + "/health", None, 15)
          assert health["http_status"] == 200 and not health["transport_error_type"], "Runtime health failed"
          chart = call_json(base + "/analysis/live/PETR4", None, 20)
          assert chart["http_status"] == 200
          data = chart["response"]
          assert data["market"]["history_count"] >= 85
          assert str(data["market"]["latest"]["observation_timestamp"]).startswith("2026-10-02")
          assert {"b3_cotahist", "oplab"} <= set(data["source_refs"])
          assert data["options"]["contract_count"] == 0
          print("ACTIVE_PETR4_HTTP=PASS bars=" + str(data["market"]["history_count"]) + " options=0", flush=True)
          version = call_json(base + "/version", None, 15)
          assert version["http_status"] == 200
          assert version["response"].get("opportunity_screen_policy") == "B3_OBSERVED_STOCK_SCREEN_V1", "Active process did not load the observed screen"
          assets = ["VALE3", "RENT3", "VIVT3", "BBAS3"]
          for objective in ("LOWEST_REALIZED_VOLATILITY_60D", "HIGHEST_OBSERVED_LIQUIDITY_20D"):
              request = {"task": "Compare explicit assets by observed objective; no future return inference.", "ticker": None, "context": {"workspace": "Opportunities", "opportunity_assets": assets, "opportunity_objective": objective, "analysis_mode": "deterministic", "research_mode": "stored_only"}}
              response = call_json(base + "/orchestrate", request, 90)
              write_private_report(Path.home() / ".local/share/b3-investment-options-agent/live-validation/active-stock-screen" / objective, {"instance": "ACTIVE HTTP systemd process", "request": request, "response": response})
              body = response.get("response") or {}
              result = body.get("result") or {}
              screen = result.get("opportunity_screen") or {}
              assert response["http_status"] == 200 and not body.get("error") and not response["transport_error_type"]
              assert screen.get("policy_version") == "B3_OBSERVED_STOCK_SCREEN_V1"
              assert set(result.get("asset_evidence") or {}) == set(assets)
              assert screen["ranked_count"] >= 2 and len(screen["rows"]) == 4
              assert result["telemetry"]["llm_calls"] == 0
              assert result["derived_synthesis_status"] == "NOT_REQUESTED"
              assert all(row["expected_return"] is None for row in screen["rows"])
              print(json.dumps({"instance": "ACTIVE HTTP systemd process", "objective": objective, "status": screen["status"], "ranked_count": screen["ranked_count"], "elapsed_ms": response["elapsed_ms"], "llm_calls": 0}), flush=True)
          print("ACTIVE_STOCK_SCREEN=PASS RUNTIME_MUTATIONS=NONE", flush=True)
          PY
