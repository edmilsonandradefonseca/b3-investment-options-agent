name: B3 V4.4 candidate Lab acceptance (Ubuntu)
on:
  push:
    branches: [feature/react-functional-v43-integration]
    paths: [.github/workflows/b3-v44-candidate.yml, scripts/validate_v44_lab_candidate.py, src/b3_agent/strategy_live.py, tests/test_strategy_live.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b3-v44-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record candidate revision
        run: echo "CANDIDATE_SHA=$GITHUB_SHA"
      - name: Verify Lab financial and temporal regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: /opt/b3-investment-options-agent/.venv/bin/python -m pytest tests/test_strategy_live.py tests/test_stock_purchase.py tests/test_economic_evidence.py tests/test_economic_decision.py tests/test_quant_engine.py tests/test_quant_beta.py tests/test_quant_indicators.py
      - name: Validate candidate API and senior on real data without restarting service
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: timeout 480s /opt/b3-investment-options-agent/.venv/bin/python scripts/validate_v44_lab_candidate.py
