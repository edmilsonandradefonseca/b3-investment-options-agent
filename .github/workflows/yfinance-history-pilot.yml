name: Yahoo daily history pilot (Ubuntu)

on:
  push:
    branches:
      - feature/react-functional-v43-integration
    paths:
      - .github/workflows/yfinance-history-pilot.yml
      - scripts/validate_yfinance_history.py
      - scripts/validate_history_only_real.py
      - src/b3_agent/orchestration/live_providers.py
      - src/b3_agent/providers/local_market_history.py
      - src/b3_agent/server.py
      - tests/test_local_market_history.py

permissions:
  contents: read

concurrency:
  group: b3-yahoo-history-pilot
  cancel-in-progress: false

jobs:
  yahoo-history:
    name: Compare Yahoo daily candles with local COTAHIST
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4

      - name: Install isolated Yahoo client within app dependency bounds
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check \
            --target "$RUNNER_TEMP/yfinance-pilot" \
            "yfinance==1.6.0" "pandas>=2.2,<3" "websockets>=14,<17"

      - name: Run read-only Yahoo comparison
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ runner.temp }}/yfinance-pilot
        run: |
          test -x /opt/b3-investment-options-agent/.venv/bin/python
          /opt/b3-investment-options-agent/.venv/bin/python \
            scripts/validate_yfinance_history.py \
            --market-root /opt/b3-runtime/data/archive/cotahist_raw \
            --tickers PETR4 VALE3 ITUB4 BBDC4 WEGE3 \
            --days 365

      - name: Validate chart path without quote or options requests
        shell: bash
        run: |
          cd /opt/b3-investment-options-agent
          timeout 45s env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/b3-investment-options-agent/.venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/validate_history_only_real.py"
